logging:
  output_file: "/var/log/easyedr/edr_events.jsonl"
  console: false

filters:
  # ignore self
  ignore_own_pid: true
  ignore_commands:
    - "easyedr"
    - "rsyslogd"
    - "systemd-journald"

hooks:
  connect:
    enabled: true

rules:
  #fork bomb detect
  fork_bomb:
    enabled: true
    threshold: 15
    global_threshold: 50
    window_seconds: 2
    group_by: "ppid"
    whitelist_commands:
      - "code"
      - "cpuUsage.sh"
      - "Xorg"
      - "firefox"
      - "chrome"
      - "chromium"
      - "code-oss"

  exec_from_tmp:
    enabled: true
    paths:
      - "/tmp"
      - "/dev/shm"
      - "/var/tmp"

  connect:
    enabled: true
    shells:
      - "bash"
      - "sh"
      - "zsh"
      - "python3"
